<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galerie — Communion d'Aria 📸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pearl: #FBF7EF;
      --ivory: #F4ECDE;
      --gold: #C7A24B;
      --gold-light: #D9C18A;
      --gold-pale: #F5EDD8;
      --blue: #3FA0A8;
      --blue-deep: #2C7C84;
      --blue-light: #D4EAF3;
      --ink: #4A4337;
      --ink-soft: #7A7263;
      --white-warm: #FFFDF8;
      --serif: "Cormorant Garamond", serif;
      --sans: "Jost", sans-serif;
    }
    body {
      font-family: var(--sans);
      font-weight: 300;
      background: var(--pearl);
      color: var(--ink);
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      background: linear-gradient(160deg, #f9f3e8, var(--gold-light));
      padding: 32px 24px 28px;
      text-align: center;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--ink-soft); text-decoration: none;
      font-size: 0.82rem; letter-spacing: 0.05em; margin-bottom: 16px;
    }
    .header-title {
      font-family: var(--serif); font-style: italic;
      font-size: 1.9rem; font-weight: 300; color: var(--ink);
    }
    .header-sub {
      font-size: 0.75rem; color: var(--ink-soft);
      letter-spacing: 0.15em; text-transform: uppercase; margin-top: 6px;
    }

    /* UPLOAD */
    .upload-section {
      margin: 20px 16px;
      background: white; border-radius: 16px;
      padding: 24px; box-shadow: 0 2px 16px rgba(0,0,0,0.06);
      text-align: center;
    }
    .upload-title {
      font-family: var(--serif); font-size: 1.1rem; margin-bottom: 4px;
    }
    .upload-sub { font-size: 0.8rem; color: var(--ink-soft); margin-bottom: 18px; }

    .drop-zone {
      border: 2px dashed var(--gold-light); border-radius: 12px;
      padding: 32px 20px; cursor: pointer; background: var(--ivory);
      transition: all 0.2s;
    }
    .drop-zone:hover, .drop-zone.over { border-color: var(--gold); background: var(--gold-pale); }
    .drop-zone .icon { font-size: 2.2rem; margin-bottom: 8px; }
    .drop-zone .hint { font-size: 0.85rem; color: var(--ink-soft); }
    .drop-zone .hint strong { color: var(--blue); }
    #file-input { display: none; }

    .preview-box { display: none; margin-top: 14px; }
    .preview-box img {
      width: 100%; max-height: 220px; object-fit: cover;
      border-radius: 10px; display: block;
    }
    .preview-box .fname { font-size: 0.75rem; color: var(--ink-soft); margin-top: 6px; }

    .send-btn {
      display: none; width: 100%; margin-top: 14px;
      padding: 13px; border: none; border-radius: 10px; cursor: pointer;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      font-family: var(--sans); font-size: 0.9rem; color: white;
      font-weight: 400; letter-spacing: 0.04em;
      transition: opacity 0.2s;
    }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg {
      margin-top: 12px; padding: 10px 14px; border-radius: 8px;
      font-size: 0.83rem; text-align: center; display: none;
    }
    .msg.ok  { background: #e8f5e9; color: #2e7d32; display: block; }
    .msg.err { background: #fdecea; color: #c62828; display: block; }
    .msg.spin { background: var(--blue-light); color: var(--blue-deep); display: block; }

    /* GRID */
    .gallery-section { padding: 0 16px 48px; }
    .gallery-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .gallery-count { font-family: var(--serif); font-size: 1.1rem; }
    .refresh-btn {
      background: none; border: 1px solid var(--blue-light);
      border-radius: 20px; padding: 5px 14px;
      font-size: 0.78rem; color: var(--blue); cursor: pointer;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-item {
      border-radius: 10px; overflow: hidden; aspect-ratio: 1;
      background: var(--gold-pale); cursor: pointer;
    }
    .grid-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .empty {
      grid-column: 1/-1; text-align: center;
      padding: 40px 20px; color: var(--ink-soft); font-size: 0.88rem; line-height: 1.8;
    }

    /* LIGHTBOX */
    .lb {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.88); z-index: 100;
      align-items: center; justify-content: center;
      padding: 60px 20px 80px; flex-direction: column; gap: 16px;
    }
    .lb.open { display: flex; }
    .lb img { max-width: 100%; max-height: 75vh; border-radius: 8px; object-fit: contain; }
    .lb-close {
      position: absolute; top: 14px; right: 18px;
      font-size: 2rem; color: white; background: none; border: none; cursor: pointer;
    }
    .lb-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .lb-dl {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 24px; border-radius: 30px; border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      font-family: var(--sans); font-size: 0.88rem; color: white;
      font-weight: 400; letter-spacing: 0.04em;
    }
    .lb-del {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 24px; border-radius: 30px; cursor: pointer;
      background: none; border: 1px solid rgba(255,255,255,0.35);
      font-family: var(--sans); font-size: 0.88rem; color: rgba(255,255,255,0.85);
      font-weight: 400; letter-spacing: 0.04em;
    }
    .lb-dl:disabled, .lb-del:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="header">
    <a class="back-link" href="/">← Retour à l'invitation</a>
    <div class="header-title">Galerie photos 📸</div>
    <div class="header-sub">Communion d'Aria · 7 juin 2026</div>
  </div>

  <div class="upload-section">
    <div class="upload-title">✨ Partagez vos souvenirs</div>
    <div class="upload-sub">Ajoutez vos plus belles photos de la journée</div>

    <div class="drop-zone" id="dropZone">
      <div class="icon">🖼️</div>
      <div class="hint">Appuyez pour choisir une photo<br/><strong>ou glissez-déposez ici</strong></div>
    </div>
    <input type="file" id="file-input" accept="image/*" />

    <div class="preview-box" id="previewBox">
      <img id="previewImg" src="" alt="Aperçu" />
      <div class="fname" id="previewName"></div>
    </div>

    <button class="send-btn" id="sendBtn">Partager cette photo 📤</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="gallery-section">
    <div class="gallery-head">
      <div class="gallery-count" id="count">📷 Chargement...</div>
      <button class="refresh-btn" id="refreshBtn">Actualiser</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="lb" id="lb">
    <button class="lb-close" id="lbClose">✕</button>
    <img id="lbImg" src="" alt="" />
    <div class="lb-actions">
      <button class="lb-dl" id="lbDl">⬇️ Enregistrer</button>
      <button class="lb-del" id="lbDel">🗑️ Supprimer</button>
    </div>
  </div>

  <script>
    var SUPABASE_URL  = 'https://wkgyhwtfctgbfwtzlgzp.supabase.co';
    var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrZ3lod3RmY3RnYmZ3dHpsZ3pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5ODA5MjQsImV4cCI6MjA5NTU1NjkyNH0.7yW77QOq6ItTYNEcWNHqdvkQYruWwYzXZOXDT-3w8R8';
    var BUCKET        = 'communion-aria';
    var BASE          = SUPABASE_URL + '/storage/v1';

    // -- Upload via fetch (pas de librairie externe) --
    function headers(extra) {
      return Object.assign({ 'Authorization': 'Bearer ' + SUPABASE_ANON, 'apikey': SUPABASE_ANON }, extra || {});
    }

    function publicUrl(name) {
      return BASE + '/object/public/' + BUCKET + '/' + encodeURIComponent(name);
    }

    function showMsg(type, text) {
      var el = document.getElementById('msg');
      el.className = 'msg ' + type;
      el.textContent = text;
    }

    function hideMsg() {
      var el = document.getElementById('msg');
      el.className = 'msg';
    }

    // Drop zone
    var dropZone = document.getElementById('dropZone');
    var fileInput = document.getElementById('file-input');
    var previewBox = document.getElementById('previewBox');
    var previewImg = document.getElementById('previewImg');
    var previewName = document.getElementById('previewName');
    var sendBtn = document.getElementById('sendBtn');
    var selectedFile = null;

    dropZone.addEventListener('click', function() { fileInput.click(); });
    dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('over'); });
    dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('over'); });
    dropZone.addEventListener('drop', function(e) {
      e.preventDefault(); dropZone.classList.remove('over');
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', function() {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    function handleFile(f) {
      selectedFile = f;
      var reader = new FileReader();
      reader.onload = function(e) {
        previewImg.src = e.target.result;
        previewName.textContent = f.name;
        previewBox.style.display = 'block';
        sendBtn.style.display = 'block';
        hideMsg();
      };
      reader.readAsDataURL(f);
    }

    sendBtn.addEventListener('click', function() {
      if (!selectedFile) return;
      var ext = selectedFile.name.split('.').pop();
      var name = 'photo_' + Date.now() + '_' + Math.random().toString(36).slice(2,6) + '.' + ext;
      sendBtn.disabled = true;
      showMsg('spin', 'Envoi en cours...');

      fetch(BASE + '/object/' + BUCKET + '/' + encodeURIComponent(name), {
        method: 'POST',
        headers: headers({ 'Content-Type': selectedFile.type || 'image/jpeg', 'x-upsert': 'false' }),
        body: selectedFile
      })
      .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
      .then(function(res) {
        if (res.ok) {
          showMsg('ok', 'Photo partagée, merci ! 🎉');
          previewBox.style.display = 'none';
          sendBtn.style.display = 'none';
          selectedFile = null;
          fileInput.value = '';
          setTimeout(loadPhotos, 800);
        } else {
          showMsg('err', 'Erreur : ' + (res.data.error || res.data.message || 'Réessaie'));
          console.error(res.data);
        }
      })
      .catch(function(e) { showMsg('err', 'Erreur réseau. Réessaie.'); console.error(e); })
      .finally(function() { sendBtn.disabled = false; });
    });

    // -- Galerie --
    function loadPhotos() {
      var countEl = document.getElementById('count');
      var grid = document.getElementById('grid');
      countEl.textContent = '📷 Chargement...';

      fetch(BASE + '/object/list/' + BUCKET + '?limit=200&offset=0&sortBy=created_at&order=desc', {
        method: 'POST',
        headers: headers({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ prefix: '', limit: 200, offset: 0, sortBy: { column: 'created_at', order: 'desc' } })
      })
      .then(function(r) { return r.json(); })
      .then(function(files) {
        var photos = (files || []).filter(function(f) { return f.name && !f.name.startsWith('.'); });
        countEl.textContent = '📷 ' + photos.length + ' photo' + (photos.length > 1 ? 's' : '');
        if (photos.length === 0) {
          grid.innerHTML = '<div class="empty">Aucune photo encore.<br/>Soyez les premiers à partager ! 🌸</div>';
          return;
        }
        grid.innerHTML = photos.map(function(f) {
          var url = publicUrl(f.name);
          return '<div class="grid-item" data-url="' + url + '" data-name="' + f.name + '"><img src="' + url + '" loading="lazy" alt="Photo" /></div>';
        }).join('');
        grid.querySelectorAll('.grid-item').forEach(function(el) {
          el.addEventListener('click', function() { openLb(el.dataset.url, el.dataset.name); });
        });
      })
      .catch(function(e) {
        countEl.textContent = '📷 —';
        grid.innerHTML = '<div class="empty">Impossible de charger les photos.<br/>Vérifie ta connexion.</div>';
        console.error(e);
      });
    }

    document.getElementById('refreshBtn').addEventListener('click', loadPhotos);

    // Lightbox
    var currentUrl = '';
    var currentName = '';
    function openLb(url, name) {
      currentUrl = url;
      currentName = name;
      document.getElementById('lbImg').src = url;
      document.getElementById('lb').classList.add('open');
    }
    function closeLb() {
      document.getElementById('lb').classList.remove('open');
      document.getElementById('lbImg').src = '';
      currentUrl = '';
      currentName = '';
    }
    document.getElementById('lbClose').addEventListener('click', closeLb);
    document.getElementById('lb').addEventListener('click', function(e) {
      if (e.target === this) closeLb();
    });

    // Téléchargement
    document.getElementById('lbDl').addEventListener('click', function() {
      if (!currentUrl) return;
      var btn = this;
      btn.disabled = true;
      btn.textContent = 'Téléchargement...';
      fetch(currentUrl)
        .then(function(r) { return r.blob(); })
        .then(function(blob) {
          var ext = blob.type.split('/')[1] || 'jpg';
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'aria-communion-' + Date.now() + '.' + ext;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(a.href);
        })
        .catch(function() { alert('Impossible de télécharger. Fais un appui long sur la photo.'); })
        .finally(function() { btn.disabled = false; btn.textContent = '⬇️ Enregistrer'; });
    });

    // Suppression
    document.getElementById('lbDel').addEventListener('click', function() {
      if (!currentName) return;
      if (!confirm('Supprimer cette photo définitivement ?')) return;
      var btn = this;
      btn.disabled = true;
      btn.textContent = 'Suppression...';
      fetch(BASE + '/object/' + BUCKET + '/' + encodeURIComponent(currentName), {
        method: 'DELETE',
        headers: headers()
      })
      .then(function(r) {
        if (r.ok) {
          closeLb();
          loadPhotos();
        } else {
          return r.json().then(function(d) { throw new Error(d.error || d.message || 'Erreur'); });
        }
      })
      .catch(function(e) { alert('Impossible de supprimer : ' + e.message); })
      .finally(function() { btn.disabled = false; btn.textContent = '🗑️ Supprimer'; });
    });

    loadPhotos();
  </script>
</body>
</html>
